name: Candidate CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: travel-production
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{ vars.TRAVEL_CD_ENABLED == 'true' &&
          github.event.workflow_run.name == 'CI' &&
          github.event.workflow_run.path == '.github/workflows/ci.yml' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.id == github.event.repository.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.package.outputs.revision }}
      digest: ${{ steps.package.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.17.1'
          package-manager-cache: false
      - name: Package and validate exact CI commit
        id: package
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVISION"
          python3 scripts/package_release.py --ref "$REVISION" --output-dir "$RUNNER_TEMP/release"
          artifact="$RUNNER_TEMP/release/travel-app-$REVISION.tar.gz"
          digest=$(sha256sum "$artifact" | cut -d ' ' -f 1)
          python3 scripts/validate_artifact.py --artifact "$artifact" --revision "$REVISION" --sha256 "$digest"
          printf 'revision=%s\ndigest=%s\n' "$REVISION" "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: travel-release
          path: ${{ runner.temp }}/release/travel-app-${{ steps.package.outputs.revision }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: travel-release
          path: ${{ runner.temp }}/release
      - name: Reject stale main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.build.outputs.revision }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          current=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current" = "$REVISION" || { echo 'Main advanced; refusing stale deployment' >&2; exit 1; }
      - name: Stream artifact to fixed SSH entry
        env:
          REVISION: ${{ needs.build.outputs.revision }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TRAVEL_DEPLOY_HOST: ${{ secrets.TRAVEL_DEPLOY_HOST }}
          TRAVEL_DEPLOY_USER: ${{ secrets.TRAVEL_DEPLOY_USER }}
          TRAVEL_DEPLOY_SSH_KEY: ${{ secrets.TRAVEL_DEPLOY_SSH_KEY }}
          TRAVEL_DEPLOY_KNOWN_HOSTS: ${{ secrets.TRAVEL_DEPLOY_KNOWN_HOSTS }}
        run: python3 scripts/cd_deploy.py "$RUNNER_TEMP/release/travel-app-$REVISION.tar.gz" "$REVISION" "$DIGEST"
